# Production stack: web app + math checker + Postgres.
#   cp .env.production.example .env.production   # fill in the values
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Images are pulled from GitHub Container Registry; add --build to build them locally instead.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  math:
    image: ghcr.io/rajvanshmalhotra/app-math:${TAG:-latest}
    build: ./sidecar
    restart: unless-stopped

  web:
    image: ghcr.io/rajvanshmalhotra/app-web:${TAG:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      math: { condition: service_started }
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app
      MATH_URL: http://math:8001
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:?set AUTH_URL, e.g. http://your-hpc-host:3000}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports: ["${WEB_PORT:-3000}:3000"]

volumes:
  pgdata: {}
